# Experiment E4: how much the cache-friendly Dockerfile saves compared with a naive one.
# Run it by hand from the Actions tab; the dashboard picks up the latest result.
name: Docker Cache Benchmark
run-name: "Docker cache benchmark · ${{ inputs.repeats }} repeats"

on:
  workflow_dispatch:
    inputs:
      repeats:
        description: How many times to repeat each measurement
        type: choice
        options: ["1", "3", "5"]
        default: "3"

permissions:
  contents: read

jobs:
  benchmark:
    name: Naive vs optimized Dockerfile
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Pull base images (network time is not part of the measurement)
        run: docker pull python:3.12 && docker pull python:3.12-slim
      - name: Run the benchmark
        run: python3 scripts/docker_benchmark.py --repeats "${{ inputs.repeats }}" --out docker-benchmark.json
      - name: Summarise
        run: python3 scripts/docker_benchmark.py --summarize docker-benchmark.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: docker-benchmark
          path: docker-benchmark.json
          retention-days: 90
