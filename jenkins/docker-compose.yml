# Local Jenkins for the demo.
#
#   cp jenkins/.env.example jenkins/.env      # then choose a password
#   docker compose -f jenkins/docker-compose.yml up -d --build
#   open http://localhost:8080 and sign in as admin
#
# Jenkins drives the host's Docker engine through its socket so pipelines can build images
# and start the staging container. That needs root inside the container: fine for a local
# demo, not for a shared server.
services:
  jenkins:
    build: .
    image: shoplite-jenkins:local
    container_name: shoplite-jenkins
    user: root
    ports:
      - "8080:8080"
    environment:
      JENKINS_ADMIN_ID: ${JENKINS_ADMIN_ID:-admin}
      JENKINS_ADMIN_PASSWORD: ${JENKINS_ADMIN_PASSWORD:?set JENKINS_ADMIN_PASSWORD in jenkins/.env}
      REPO_URL: ${REPO_URL:-https://github.com/AmbujKRai/ci-pipeline-optimization.git}
      REPO_BRANCH: ${REPO_BRANCH:-main}
      CI_NETWORK: shoplite-ci
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - ci

networks:
  ci:
    name: shoplite-ci

volumes:
  jenkins_home:
