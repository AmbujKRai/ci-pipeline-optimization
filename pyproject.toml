[project]
name = "shoplite"
version = "1.0.0"
description = "ShopLite: demo service for the CI pipeline optimization project"
readme = "README.md"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["site", "htmlcov"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "RUF"]
# RUF001-003 flag the rupee sign and other non-ASCII text that is intentional here.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "-m", "not smoke"]
markers = [
    "smoke: post-deployment checks against a live URL (deselected unless -m smoke)",
    "external: talks to a stubbed external service with simulated network latency",
    "slow: CPU or database heavy",
]
xfail_strict = true

[tool.coverage.run]
source = ["app"]
branch = true
relative_files = true

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
